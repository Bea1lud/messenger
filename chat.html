<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/stegcloak.min.js"></script>
  <style>
    :root {
      --green: #5DB075;
      --green-dark: #4ca565;
      --bg: #ffffff;
      --page: #f2f4f7;
      --muted-bg: #f6f6f6;
      --border: #e8e8e8;
      --text: #000000;
      --muted: #bdbdbd;
      --muted-2: #666666;
      --danger: #830000;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--page);
      font-family: "Inter", sans-serif;
      color: var(--text);
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 18px 10px;
    }

    .app-shell {
      width: 100%;
      max-width: 375px;
      height: 812px;
      background: var(--bg);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      background: #fff;
    }

    .screen.active {
      display: flex;
    }

    .screen-page {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      flex: 1;
    }

    .page-header {
      height: 36px;
      margin: 24px 16px 0;
      position: relative;
      flex-shrink: 0;
    }

    .page-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 30px;
      line-height: 36px;
      font-weight: 700;
      margin: 0;
      white-space: nowrap;
    }

    .header-left,
    .header-right {
      position: absolute;
      top: 8px;
      font-size: 16px;
      line-height: 19px;
      font-weight: 500;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .header-left {
      left: 0;
      color: var(--danger);
    }

    .header-right {
      right: 0;
      color: var(--green);
    }

    .login-body {
      padding: 31px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    .field {
      width: 100%;
      height: 50px;
      border: 1px solid var(--border);
      background: var(--muted-bg);
      border-radius: 100px;
      padding: 0 16px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field.square {
      border-radius: 8px;
    }

    .field:focus, .textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(93, 176, 117, 0.15);
    }

    .field::placeholder, .textarea::placeholder {
      color: var(--muted);
    }

    .textarea {
      width: 100%;
      min-height: 92px;
      border: 1px solid var(--border);
      background: var(--muted-bg);
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.4;
      resize: none;
      outline: none;
      font-family: inherit;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .primary-btn {
      height: 51px;
      border: none;
      border-radius: 100px;
      background: var(--green);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.08s ease;
    }

    .primary-btn:hover {
      background: var(--green-dark);
    }

    .primary-btn:active {
      transform: translateY(1px);
    }

    .helper {
      font-size: 13px;
      line-height: 18px;
      color: var(--muted);
    }

    .label {
      font-size: 12px;
      line-height: 15px;
      color: var(--muted-2);
      margin: 2px 0 6px;
    }

    .password-wrap {
      position: relative;
      width: 100%;
    }

    .password-wrap .field {
      padding-right: 50px;
    }

    .toggle-visibility {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      padding: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #333;
    }

    .toggle-visibility svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .chat-main, .steg-main {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      height: 100%;
    }

    .top-actions {
      padding: 14px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
      min-height: 22px;
    }

    .status-line {
      padding: 0 16px 10px;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 0 16px 8px;
      scroll-behavior: smooth;
    }

    .empty-state {
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 18px 16px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      margin-top: 8px;
    }

    .message-card {
      display: flex;
      gap: 16px;
      padding: 0 0 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .avatar.green { background: #bdfdb7; }
    .avatar.blue { background: #b7f8fd; }
    .avatar.purple { background: #e8dcff; }
    .avatar.red { background: #ffd8d8; }

    .message-content {
      min-width: 0;
      flex: 1;
    }

    .message-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .message-author-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .message-author {
      font-size: 16px;
      font-weight: 700;
      line-height: 19px;
      margin: 0;
    }

    .message-time {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .message-trash {
      border: none;
      background: transparent;
      padding: 0;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #666;
      flex-shrink: 0;
    }

    .message-trash svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .message-text {
      font-size: 14px;
      line-height: 19px;
      color: #111;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .composer-wrap {
      margin-top: auto;
      padding: 8px 16px 12px;
      flex-shrink: 0;
      background: #fff;
      position: sticky;
      bottom: 0;
      z-index: 2;
    }

    .composer {
      height: 50px;
      border: 1px solid var(--border);
      background: #f4f4f4;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      padding: 0 8px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
    }

    .composer input::placeholder {
      color: var(--muted);
    }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }

    .send-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      transform: translateX(1px);
    }

    .tabbar {
      height: 64px;
      flex-shrink: 0;
      position: relative;
      background: #fafafa;
      border-top: 0.5px solid #bdc5cd;
    }

    .tab-icons {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .tab-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #e8e8e8;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.08s ease;
    }

    .tab-dot.active {
      background: var(--green);
    }

    .tab-dot:active {
      transform: scale(0.97);
    }

    .hidden {
      display: none !important;
    }

    .steg-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 18px 10px;
    }

    .seg-label {
      font-size: 12px;
      line-height: 15px;
      color: var(--muted-2);
      text-align: center;
      margin-bottom: 8px;
    }

    .segment {
      position: relative;
      height: 50px;
      border: 1px solid var(--border);
      background: var(--muted-bg);
      border-radius: 100px;
      padding: 2px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 18px;
    }

    .segment-slider {
      position: absolute;
      top: 2px;
      left: 2px;
      width: calc(50% - 2px);
      height: 46px;
      background: #fff;
      border-radius: 100px;
      transition: transform 0.22s ease;
    }

    .segment.reveal .segment-slider {
      transform: translateX(100%);
    }

    .segment-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
    }

    .segment-btn.active {
      color: var(--green);
      font-weight: 600;
    }

    .result-box {
      margin-top: 18px;
      text-align: center;
      padding: 8px 8px 0;
    }

    .result-title {
      font-size: 24px;
      line-height: 29px;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .result-text {
      font-size: 16px;
      line-height: 19px;
      color: var(--muted-2);
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 150px;
      overflow-y: auto;
      padding: 0 4px;
    }

    .actions {
      padding: 18px 22px 20px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .actions .primary-btn {
      width: 100%;
      max-width: 260px;
    }

    .clear-link {
      display: block;
      text-align: center;
      color: var(--green);
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <section id="loginScreen" class="screen active">
      <div class="page-header">
        <h1 class="page-title">Log In</h1>
      </div>

      <div class="login-body">
        <div class="password-wrap">
          <input id="roomIdInput" class="field square" type="password" placeholder="Password / Room ID" />
          <button class="toggle-visibility" data-target="roomIdInput" aria-label="Toggle visibility"></button>
        </div>
        <button id="loginBtn" class="primary-btn">Log In</button>
        <div class="helper">
        </div>
        <div id="loginStatus" class="helper">Ожидаем подключения...</div>
      </div>
    </section>

    <section id="appScreen" class="screen">
      <div id="chatPage" class="screen-page">
        <div class="page-header">
          <button id="backBtn" class="header-left">Back</button>
          <h1 class="page-title">Чат</h1>
          <button id="clearBtn" class="header-right">Clear</button>
        </div>

        <div class="chat-main">
          <div class="top-actions"></div>

          <div id="statusLine" class="status-line"></div>

          <div id="messages" class="messages">
            <div id="emptyState" class="empty-state">
              Здесь появятся сообщения. Подключи второго собеседника с тем же ключом.
            </div>
          </div>

          <div class="composer-wrap">
            <div class="composer">
              <input id="messageInput" type="text" placeholder="Сообщение" />
              <button id="sendBtn" class="send-btn" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3.4 20.6 21 12 3.4 3.4l.1 6.6 10.2 2-10.2 2z"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="stegPage" class="screen-page hidden">
        <div class="page-header">
          <button id="stegBackBtn" class="header-left">Back</button>
          <h1 class="page-title">StegCloak</h1>
        </div>

        <div class="steg-main">
          <div class="steg-scroll">
            <div class="seg-label">Choose:</div>
            <div id="stegModeSegment" class="segment">
              <div class="segment-slider"></div>
              <button id="hideModeBtn" class="segment-btn active">Hide</button>
              <button id="revealModeBtn" class="segment-btn">Reveal</button>
            </div>

            <div id="hideFields">
              <div class="label">Cover text:</div>
              <input id="stegCoverInput" class="field" type="text" placeholder="Видимый текст" />

              <div class="label" style="margin-top:14px;">Password:</div>
              <div class="password-wrap">
                <input id="stegPasswordInput" class="field" type="password" placeholder="Пароль" />
                <button class="toggle-visibility" data-target="stegPasswordInput" aria-label="Toggle visibility"></button>
              </div>

              <div class="label" style="margin-top:14px;">Message:</div>
              <textarea id="stegSecretInput" class="textarea" placeholder="Скрываемое сообщение"></textarea>
            </div>

            <div id="revealFields" class="hidden">
              <div class="label">Password:</div>
              <div class="password-wrap">
                <input id="stegRevealPasswordInput" class="field" type="password" placeholder="Пароль" />
                <button class="toggle-visibility" data-target="stegRevealPasswordInput" aria-label="Toggle visibility"></button>
              </div>

              <div class="label" style="margin-top:14px;">Crypted message:</div>
              <textarea id="stegRevealInput" class="textarea" placeholder="Текст со скрытым сообщением"></textarea>
            </div>

            <div class="result-box">
              <h3 class="result-title">Result</h3>
              <p id="stegResult" class="result-text">Результат появится здесь</p>
            </div>
          </div>

          <div class="actions">
            <button id="stegActionBtn" class="primary-btn">Hide</button>
            <button id="copyStegBtn" class="clear-link">Copy result</button>
            <button id="clearStegBtn" class="clear-link">Clear fields</button>
          </div>
        </div>
      </div>
    </section>

    <div class="tabbar hidden" id="tabbar">
      <div class="tab-icons">
        <button id="chatTabBtn" class="tab-dot active" title="Чат"></button>
        <button id="stegTabBtn" class="tab-dot" title="StegCloak"></button>
      </div>
    </div>
  </div>

  <script>
    const EYE_OPEN_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 10a2 2 0 1 0 0 -4 2 2 0 0 0 0 4Z"></path>
        <path fill-rule="evenodd" d="M0.8819999999999999 7.631333333333332C1.8739999999999999 4.650666666666666 4.6853333333333325 2.5 8.000666666666666 2.5c3.313333333333333 0 6.123333333333333 2.1486666666666663 7.116666666666667 5.126666666666667 0.07999999999999999 0.24133333333333332 0.07999999999999999 0.5013333333333333 0 0.742 -0.9913333333333334 2.9806666666666666 -3.8033333333333332 5.131333333333333 -7.117999999999999 5.131333333333333 -3.313333333333333 0 -6.124 -2.1486666666666663 -7.116666666666667 -5.126666666666667a1.1746666666666665 1.1746666666666665 0 0 1 0 -0.742ZM11.5 8a3.5 3.5 0 1 1 -7 0 3.5 3.5 0 0 1 7 0Z" clip-rule="evenodd"></path>

    const TRASH_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">

    let ws = null;
    let pc = null;
    let dataChannel = null;
    let roomId = "";
    let channelId = "";
    let role = null;
    let aesKey = null;
    let joined = false;
    let isDeletingDialog = false;
    let activeAppTab = "chat";
    let stegMode = "hide";

    const loginScreen = document.getElementById("loginScreen");
    const appScreen = document.getElementById("appScreen");
    const tabbar = document.getElementById("tabbar");

    const chatPage = document.getElementById("chatPage");
    const stegPage = document.getElementById("stegPage");

    const chatTabBtn = document.getElementById("chatTabBtn");
    const stegTabBtn = document.getElementById("stegTabBtn");

    const roomIdInput = document.getElementById("roomIdInput");
    const loginBtn = document.getElementById("loginBtn");
    const backBtn = document.getElementById("backBtn");
    const stegBackBtn = document.getElementById("stegBackBtn");
    const clearBtn = document.getElementById("clearBtn");

    const loginStatus = document.getElementById("loginStatus");
    const statusLine = document.getElementById("statusLine");

    const messagesEl = document.getElementById("messages");
    const emptyState = document.getElementById("emptyState");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    const stegModeSegment = document.getElementById("stegModeSegment");
    const hideModeBtn = document.getElementById("hideModeBtn");
    const revealModeBtn = document.getElementById("revealModeBtn");
    const hideFields = document.getElementById("hideFields");
    const revealFields = document.getElementById("revealFields");
    const stegActionBtn = document.getElementById("stegActionBtn");
    const clearStegBtn = document.getElementById("clearStegBtn");
    const copyStegBtn = document.getElementById("copyStegBtn");
    const stegResult = document.getElementById("stegResult");

    const stegCoverInput = document.getElementById("stegCoverInput");
    const stegPasswordInput = document.getElementById("stegPasswordInput");
    const stegSecretInput = document.getElementById("stegSecretInput");
    const stegRevealPasswordInput = document.getElementById("stegRevealPasswordInput");
    const stegRevealInput = document.getElementById("stegRevealInput");

    function showLogin() {
      loginScreen.classList.add("active");
      appScreen.classList.remove("active");
      tabbar.classList.add("hidden");
    }

    function showApp() {
      loginScreen.classList.remove("active");
      appScreen.classList.add("active");
      tabbar.classList.remove("hidden");
      switchTab(activeAppTab);
    }

    function switchTab(tab) {
      activeAppTab = tab;
      chatPage.classList.toggle("hidden", tab !== "chat");
      stegPage.classList.toggle("hidden", tab !== "steg");
      chatTabBtn.classList.toggle("active", tab === "chat");
      stegTabBtn.classList.toggle("active", tab === "steg");
    }

    function setStegMode(mode) {
      stegMode = mode;
      const reveal = mode === "reveal";
      stegModeSegment.classList.toggle("reveal", reveal);
      hideModeBtn.classList.toggle("active", !reveal);
      revealModeBtn.classList.toggle("active", reveal);
      hideFields.classList.toggle("hidden", reveal);
      revealFields.classList.toggle("hidden", !reveal);
      stegActionBtn.textContent = reveal ? "Reveal" : "Hide";
      stegResult.textContent = "Результат появится здесь";
    }

    function setLoginStatus(text) {
      loginStatus.textContent = text;
    }

    function setStatus(text) {
      statusLine.textContent = text;
    }

    function getTimeString(ts = null) {
      const d = ts ? new Date(ts * 1000) : new Date();
      return d.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getAvatarClass(type) {
      if (type === "me") return "green";
      if (type === "peer") return "blue";
      if (type === "history") return "purple";
      return "red";
    }

    function getAuthorLabel(type) {
      if (type === "me") return "Вы";
      if (type === "peer") return "Собеседник";
      if (type === "history") return "История";
      return "Система";
    }

    function hideEmptyState() {
      if (emptyState) emptyState.classList.add("hidden");
    }

    function showEmptyState(text) {
      emptyState.textContent = text;
      emptyState.classList.remove("hidden");
    }

    function renderVisibilityButtons() {
      document.querySelectorAll(".toggle-visibility").forEach(btn => {
        const target = document.getElementById(btn.dataset.target);
        if (!target) return;
        btn.innerHTML = target.type === "password" ? EYE_CLOSED_SVG : EYE_OPEN_SVG;
      });
    }

    function initVisibilityToggles() {
      document.querySelectorAll(".toggle-visibility").forEach(btn => {
        btn.addEventListener("click", () => {
          const target = document.getElementById(btn.dataset.target);
          if (!target) return;
          target.type = target.type === "password" ? "text" : "password";
          renderVisibilityButtons();
        });
      });
      renderVisibilityButtons();
    }

    function generateMessageId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return "msg_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    }

    function removeMessageFromUI(messageId) {
      const el = document.querySelector(`[data-message-id="${messageId}"]`);
      if (el) el.remove();

      if (!messagesEl.querySelector(".message-card")) {
        showEmptyState("История пуста");
      }
    }

    function appendMessage(text, type = "system", customTime = null, messageId = null) {
      hideEmptyState();

      const card = document.createElement("div");
      card.className = "message-card";
      if (messageId) card.dataset.messageId = messageId;

      const avatar = document.createElement("div");
      avatar.className = `avatar ${getAvatarClass(type)}`;

      const content = document.createElement("div");
      content.className = "message-content";

      const head = document.createElement("div");
      head.className = "message-head";

      const authorWrap = document.createElement("div");
      authorWrap.className = "message-author-wrap";

      const author = document.createElement("h3");
      author.className = "message-author";
      author.textContent = getAuthorLabel(type);

      authorWrap.appendChild(author);

      if (messageId) {
        const trashBtn = document.createElement("button");
        trashBtn.className = "message-trash";
        trashBtn.innerHTML = TRASH_SVG;
        trashBtn.title = "Удалить сообщение";
        trashBtn.addEventListener("click", () => deleteMessage(messageId));
        authorWrap.appendChild(trashBtn);
      }

      const time = document.createElement("div");
      time.className = "message-time";
      time.textContent = customTime || getTimeString();

      const body = document.createElement("p");
      body.className = "message-text";
      body.textContent = text;

      head.appendChild(authorWrap);
      head.appendChild(time);
      content.appendChild(head);
      content.appendChild(body);

      card.appendChild(avatar);
      card.appendChild(content);

      messagesEl.appendChild(card);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function clearMessages() {
      messagesEl.innerHTML = "";
      messagesEl.appendChild(emptyState);
      showEmptyState("Здесь появятся сообщения. Подключи второго собеседника с тем же ключом.");
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    async function deriveChannelId(room) {
      const encoder = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw",
        encoder.encode(room),
        "PBKDF2",
        false,
        ["deriveBits"]
      );

      const derivedBits = await crypto.subtle.deriveBits(
        {
          name: "PBKDF2",
          salt: encoder.encode("messenger-channel-v2"),
          iterations: 250000,
          hash: "SHA-256"
        },
        baseKey,
        256
      );

      const finalHash = await crypto.subtle.digest("SHA-256", derivedBits);
      const arr = Array.from(new Uint8Array(finalHash));
      return arr.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function deriveKeyFromRoom(room) {
      const encoder = new TextEncoder();
      const salt = encoder.encode("messenger-static-salt-v2");

      const baseKey = await crypto.subtle.importKey(
        "raw",
        encoder.encode(room),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      return await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 250000,
          hash: "SHA-256"
        },
        baseKey,
        {
          name: "AES-GCM",
          length: 256
        },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptMessage(plainText) {
      const encoder = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));

      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        aesKey,
        encoder.encode(plainText)
      );

      return JSON.stringify({
        iv: arrayBufferToBase64(iv.buffer),
        data: arrayBufferToBase64(encrypted)
      });
    }

    async function decryptMessage(payload) {
      const parsed = JSON.parse(payload);
      const decoder = new TextDecoder();

      const iv = new Uint8Array(base64ToArrayBuffer(parsed.iv));
      const encryptedData = base64ToArrayBuffer(parsed.data);

      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        aesKey,
        encryptedData
      );

      return decoder.decode(decrypted);
    }

    function resetAppState() {
      roomId = "";
      channelId = "";
      role = null;
      aesKey = null;
      joined = false;
      isDeletingDialog = false;
      roomIdInput.value = "";
      messageInput.value = "";
      setLoginStatus("Не подключено");
      setStatus("Ожидание подключения...");
      clearMessages();
      showLogin();
    }

    function cleanupConnections() {
      try { if (dataChannel) dataChannel.close(); } catch (e) {}
      try { if (pc) pc.close(); } catch (e) {}
      try { if (ws) ws.close(); } catch (e) {}

      dataChannel = null;
      pc = null;
      ws = null;
      joined = false;
      role = null;
    }

    function forceReturnToLogin() {
      cleanupConnections();
      resetAppState();
      location.reload();
    }

    function setupDataChannel() {
      if (!dataChannel) return;

      dataChannel.onopen = () => {
        setStatus("P2P канал открыт");
      };

      dataChannel.onclose = () => {
        setStatus("P2P канал закрыт");
      };

      dataChannel.onerror = () => {
        setStatus("Ошибка P2P канала");
      };

      dataChannel.onmessage = async (event) => {
        try {
          const packet = JSON.parse(event.data);
          if (packet.type === "chat-message") {
            const text = await decryptMessage(packet.payload);
            appendMessage(text, "peer", null, packet.id || null);
          }
        } catch (e) {
          appendMessage("[Ошибка расшифровки сообщения]", "system");
        }
      };
    }

    function createPeerConnection() {
      pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });

      pc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: "ice-candidate",
            candidate: event.candidate
          }));
        }
      };

      pc.ondatachannel = (event) => {
        dataChannel = event.channel;
        setupDataChannel();
      };

      pc.onconnectionstatechange = () => {
        setStatus("Состояние P2P: " + pc.connectionState);
      };
    }

    async function requestWipeAll() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wipeWs = new WebSocket(`${protocol}//${location.host}/ws`);

      wipeWs.onopen = () => {
        wipeWs.send(JSON.stringify({ type: "wipe-all" }));
      };

      wipeWs.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "server-wiped") {
            alert("Весь history.json очищен.");
            location.reload();
          }
        } catch (e) {}
      };

      wipeWs.onerror = () => {
        alert("Не удалось очистить history.json");
      };
    }

    async function joinRoom() {
      const enteredRoom = roomIdInput.value.trim();

      if (!enteredRoom) {
        alert("Введите room ID");
        return;
      }

      if (enteredRoom === "111") {
        await requestWipeAll();
        return;
      }

      if (joined) {
        alert("Вы уже подключены");
        return;
      }

      roomId = enteredRoom;
      channelId = await deriveChannelId(roomId);
      setLoginStatus("Подготовка ключа...");
      aesKey = await deriveKeyFromRoom(roomId);

      createPeerConnection();

      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "join",
          room: channelId
        }));
        setLoginStatus("Подключено к signaling server");
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "room-full") {
          alert("В этой комнате уже есть 2 участника");
          cleanupConnections();
          resetAppState();
          return;
        }

        if (msg.type === "joined") {
          joined = true;
          role = msg.role;
          showApp();
          switchTab("chat");
          clearMessages();
          appendMessage("Вы вошли в защищённый чат", "system");
          setStatus("Подключено. Ожидание второго участника...");

          try {
            await loadHistory(true);
          } catch (e) {}
        }

        if (msg.type === "ready") {
          setStatus("Оба участника в комнате. Устанавливаем P2P...");

          try {
            await loadHistory(true);
          } catch (e) {}

          if (role === "offerer" && !dataChannel) {
            dataChannel = pc.createDataChannel("chat");
            setupDataChannel();

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            ws.send(JSON.stringify({
              type: "offer",
              offer: offer
            }));
          }
        }

        if (msg.type === "offer") {
          await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          ws.send(JSON.stringify({
            type: "answer",
            answer: answer
          }));
        }

        if (msg.type === "answer") {
          await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
        }

        if (msg.type === "ice-candidate") {
          try {
            await pc.addIceCandidate(msg.candidate);
          } catch (e) {}
        }

        if (msg.type === "relay-message") {
          try {
            const text = await decryptMessage(msg.payload);
            appendMessage(text, "peer", null, msg.id || null);
          } catch (e) {
            appendMessage("[Ошибка расшифровки relay-сообщения]", "system");
          }
        }

        if (msg.type === "dialog-deleted") {
          forceReturnToLogin();
        }

        if (msg.type === "server-wiped") {
          alert("Вся история сервера удалена. Сайт будет перезагружен.");
          forceReturnToLogin();
        }

        if (msg.type === "message-deleted" && msg.id) {
          removeMessageFromUI(msg.id);
        }
      };

      ws.onerror = () => {
        setLoginStatus("Ошибка WebSocket");
        setStatus("Ошибка WebSocket");
      };

      ws.onclose = () => {
        if (isDeletingDialog) return;

        if (!joined) {
          setLoginStatus("Не удалось подключиться");
        } else {
          setStatus("Соединение с сервером закрыто");
        }
      };
    }

    async function sendMessage() {
      const text = messageInput.value.trim();

      if (!text) return;
      if (!joined) {
        alert("Сначала войдите в чат");
        return;
      }

      try {
        if (ws && ws.readyState === WebSocket.OPEN && text === "111") {
          ws.send(JSON.stringify({ type: "wipe-all" }));
          messageInput.value = "";
          return;
        }

        const messageId = generateMessageId();
        const encryptedPayload = await encryptMessage(text);

        const canUseP2P = dataChannel && dataChannel.readyState === "open";

        if (canUseP2P) {
          dataChannel.send(JSON.stringify({
            type: "chat-message",
            id: messageId,
            payload: encryptedPayload
          }));
        } else if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: "relay-message",
            room: channelId,
            id: messageId,
            payload: encryptedPayload
          }));
        } else {
          alert("Нет активного соединения для отправки");
          return;
        }

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: "store-message",
            room: channelId,
            id: messageId,
            payload: encryptedPayload
          }));
        }

        appendMessage(text, "me", null, messageId);
        messageInput.value = "";
      } catch (e) {
        alert("Ошибка отправки сообщения");
      }
    }

    async function loadHistory(silent = false) {
      const enteredRoom = roomIdInput.value.trim() || roomId;

      if (!enteredRoom) {
        if (!silent) alert("Введите room ID");
        return;
      }

      try {
        const enteredChannelId = await deriveChannelId(enteredRoom);

        if (!aesKey || roomId !== enteredRoom) {
          aesKey = await deriveKeyFromRoom(enteredRoom);
        }

        const response = await fetch(`/history?room=${encodeURIComponent(enteredChannelId)}`);
        const result = await response.json();

        if (!result.ok) {
          if (!silent) alert("Не удалось загрузить историю");
          return;
        }

        clearMessages();

        if (!result.history || result.history.length === 0) {
          showEmptyState("История пуста");
          return;
        }

        for (const item of result.history) {
          try {
            const text = await decryptMessage(item.data);
            appendMessage(
              text,
              "history",
              item.created_at ? getTimeString(item.created_at) : null,
              item.id || null
            );
          } catch (e) {
            appendMessage("[Невозможно расшифровать запись]", "system");
          }
        }
      } catch (e) {
        if (!silent) alert("Ошибка загрузки истории");
      }
    }

    async function clearHistory() {
      if (!channelId) {
        alert("Комната не определена");
        return;
      }

      const confirmed = confirm("Удалить историю у обоих пользователей и сбросить чат?");
      if (!confirmed) return;

      try {
        isDeletingDialog = true;

        const response = await fetch("/clear-history", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            room: channelId
          })
        });

        const result = await response.json();

        if (!result.ok) {
          isDeletingDialog = false;
          alert("Не удалось удалить диалог");
        }
      } catch (e) {
        isDeletingDialog = false;
        alert("Ошибка удаления диалога");
      }
    }

    async function deleteMessage(messageId) {
      if (!channelId || !messageId) return;

      const confirmed = confirm("Удалить это сообщение у всех?");
      if (!confirmed) return;

      try {
        const response = await fetch("/delete-message", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            room: channelId,
            id: messageId
          })
        });

        const result = await response.json();

        if (!result.ok) {
          alert("Не удалось удалить сообщение");
        }
      } catch (e) {
        alert("Ошибка удаления сообщения");
      }
    }

    function goBackToLogin() {
      cleanupConnections();
      resetAppState();
    }

    function clearStegFields() {
      stegCoverInput.value = "";
      stegPasswordInput.value = "";
      stegSecretInput.value = "";
      stegRevealPasswordInput.value = "";
      stegRevealInput.value = "";
      stegResult.textContent = "Результат появится здесь";
    }

    async function copyStegResult() {
      const text = stegResult.textContent;
      if (!text || text === "Результат появится здесь") {
        alert("Сначала получи результат");
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
        alert("Результат скопирован");
      } catch (e) {
        alert("Не удалось скопировать");
      }
    }

    function createStegcloakInstance() {
      if (typeof StegCloak === "undefined") return null;
      try {
        return new StegCloak(true, false);
      } catch (e) {
        try {
          return new StegCloak();
        } catch (e2) {
          return null;
        }
      }
    }

    function runStegcloak() {
      const stegcloak = createStegcloakInstance();

      if (!stegcloak) {
        stegResult.textContent = "StegCloak не загрузился";
        return;
      }

      try {
        if (stegMode === "hide") {
          const cover = stegCoverInput.value;
          const password = stegPasswordInput.value;
          const secret = stegSecretInput.value;

          if (!cover.trim() || !password || !secret.trim()) {
            alert("Заполни Cover text, Password и Message");
            return;
          }

          const result = stegcloak.hide(secret, password, cover);
          stegResult.textContent = result;
        } else {
          const password = stegRevealPasswordInput.value;
          const data = stegRevealInput.value;

          if (!password || !data.trim()) {
            alert("Заполни Password и Crypted message");
            return;
          }

          const result = stegcloak.reveal(data, password);
          stegResult.textContent = result || "Скрытое сообщение не найдено";
        }
      } catch (e) {
        stegResult.textContent = "Ошибка: неверный пароль или некорректный текст";
      }
    }

    loginBtn.addEventListener("click", joinRoom);
    sendBtn.addEventListener("click", sendMessage);
    clearBtn.addEventListener("click", clearHistory);
    backBtn.addEventListener("click", goBackToLogin);
    stegBackBtn.addEventListener("click", goBackToLogin);

    chatTabBtn.addEventListener("click", () => switchTab("chat"));
    stegTabBtn.addEventListener("click", () => switchTab("steg"));

    hideModeBtn.addEventListener("click", () => setStegMode("hide"));
    revealModeBtn.addEventListener("click", () => setStegMode("reveal"));
    stegActionBtn.addEventListener("click", runStegcloak);
    clearStegBtn.addEventListener("click", clearStegFields);
    copyStegBtn.addEventListener("click", copyStegResult);

    roomIdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") joinRoom();
    });

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    stegSecretInput.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") runStegcloak();
    });

    stegRevealInput.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") runStegcloak();
    });

    window.addEventListener("beforeunload", () => {
      cleanupConnections();
    });

    initVisibilityToggles();
    setStegMode("hide");
    switchTab("chat");
  </script>
</body>
</html>
